services:
  agent:
    build: .
    env_file: .env
    environment:
      - HTTPS_PROXY=http://proxy:3128
      - HTTP_PROXY=http://proxy:3128
      - TABLE_NAME=diabetes_binary
    volumes:
      - ./diabetes.db:/app/diabetes.db:ro
    depends_on:
      proxy:
        condition: service_healthy
    networks: [llmnet]

  proxy:
    image: ubuntu/squid
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
      - squid-logs:/var/log/squid
    healthcheck:
      test: ["CMD", "squid", "-k", "check"]
      interval: 5s
      retries: 5
    networks: [llmnet, external]

networks:
  llmnet:
    internal: true
  external:

volumes:
  squid-logs: