services:
  agent:
    build: .
    env_file:
      - .env
    environment:
      HTTPS_PROXY: http://proxy:3128
      HTTP_PROXY: http://proxy:3128
      https_proxy: http://proxy:3128
      http_proxy: http://proxy:3128
      NO_PROXY: localhost,127.0.0.1
      no_proxy: localhost,127.0.0.1
      TABLE_NAME: diabetes_binary 

    volumes:
      - ./diabetes.db:/app/diabetes.db:ro
      - ./output:/app/output
      - ./logs:/app/logs

    depends_on:
      proxy:
        condition: service_healthy

    read_only: true
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 128

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true    

    networks:
      - llmnet

  api-gateway:
    image: alpine/socat
    command:
      - TCP-LISTEN:8000,fork,reuseaddr
      - TCP:agent:8000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - agent
    networks:
      - llmnet
      - apinet

  proxy:
    image: ubuntu/squid

    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
      - squid-logs:/var/log/squid

    healthcheck:
      test: ["CMD", "squid", "-k", "check"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - llmnet
      - external

networks:
  llmnet:
    internal: true

  external:

  apinet:
    driver: bridge

volumes:
  squid-logs:
  graph-file: